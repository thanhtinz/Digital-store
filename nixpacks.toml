# Nixpacks cho Railway.
# QUAN TRỌNG: ép cài CẢ devDependencies khi build (typescript/tsc nằm ở devDeps).
# Nếu không, khi NODE_ENV=production npm sẽ bỏ devDeps -> "tsc: not found".
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --include=dev"]

# Build/Start do railway.json điều khiển (buildCommand = npm run build,
# startCommand = npm run start:railway).
